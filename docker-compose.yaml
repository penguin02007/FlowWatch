services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    container_name: flowwatch-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - netflow-net

  kibana:
      image: docker.elastic.co/kibana/kibana:8.17.6
      container_name: kibana
      ports:
        - "0.0.0.0:5601:5601"
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      depends_on:
        - elasticsearch
      networks:
        - netflow-net

  flow-collector:
      image: elastiflow/flow-collector:7.26.3
      container_name: flow-collector
      restart: 'unless-stopped'
      ports:
        - "0.0.0.0:2055:2055/udp"
      environment:
        - EF_LICENSE_ACCEPTED=true
        - EF_OUTPUT_ELASTICSEARCH_ENABLE=true
        - EF_OUTPUT_ELASTICSEARCH_ADDRESSES=elasticsearch:9200
        - EF_OUTPUT_ELASTICSEARCH_TLS_ENABLE=false
        - EF_OUTPUT_ELASTICSEARCH_TLS_SKIP_VERIFICATION=false
        - EF_OUTPUT_ELASTICSEARCH_INDEX_TEMPLATE_ENABLE=true
        - EF_FLOW_SERVER_UDP_IP=0.0.0.0
        - EF_FLOW_SERVER_UDP_PORT=2055,4739,6343,9995
        - EF_LOGGER_ENCODING=json
        - EF_API_IP=0.0.0.0
        - EF_API_PORT=8080
      depends_on:
        - elasticsearch
      networks:
        - netflow-net

  nflow-generator:
      build:
        context: ./netflow-sender
        dockerfile: Dockerfile
      container_name: nflow-generator
      restart: 'unless-stopped'
      environment:
        - FLOW_COLLECTOR_HOST=flow-collector
        - FLOW_COLLECTOR_PORT=2055
        - FLOW_COUNT=1
        - SEND_INTERVAL=1.0
      depends_on:
        - flow-collector
      networks:
        - netflow-net

  udp-probe:
      image: ubuntu:22.04
      container_name: udp-probe
      command: ["/bin/bash", "-lc", "apt-get update && apt-get install -y iproute2 tcpdump iputils-ping && tcpdump -i any udp port 2055 -nn -vv -U"]
      depends_on:
        - nflow-generator
        - flow-collector
      networks:
        - netflow-net

  flowwatch-backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flowwatch-backend
    ports:
      - "8501:8501"
    environment:
      - ES_HOST=http://elasticsearch:9200
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - elasticsearch
    networks:
      - netflow-net

volumes:
  es_data:

networks:
  netflow-net:
    driver: bridge