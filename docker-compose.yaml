services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    container_name: flowwatch-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - netflow-net

  kibana:
      image: docker.elastic.co/kibana/kibana:8.17.6
      container_name: kibana
      ports:
        - "0.0.0.0:5601:5601"
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      depends_on:
        - elasticsearch
      networks:
        - netflow-net

  flow-collector:
      image: elastiflow/flow-collector:7.26.3
      container_name: flow-collector
      restart: 'unless-stopped'
      ports:
        - "2055:2055/udp"
      environment:
        - EF_LICENSE_ACCEPTED=true
        - EF_OUTPUT_ELASTICSEARCH_ES_HOSTS=http://elasticsearch:9200
      depends_on:
        - elasticsearch
      networks:
        - netflow-net

  nflow-generator:
      image: networkstatic/nflow-generator:latest
      container_name: nflow-generator
      restart: 'unless-stopped'
      command: ["-t", "flow-collector", "-p", "2055", "-c", "32"]
      depends_on:
        - flow-collector
      networks:
        - netflow-net

  flowwatch-backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flowwatch-backend
    ports:
      - "8501:8501"
    environment:
      - ES_HOST=http://elasticsearch:9200
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - elasticsearch
    networks:
      - netflow-net

volumes:
  es_data:

networks:
  netflow-net:
    driver: bridge