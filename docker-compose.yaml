# Four services share one image. Only es-setup builds it; the others set
# pull_policy: never and reuse the local image, so parallel builds don't race
# to tag the same name.
x-pipeline: &pipeline
  image: flowwatch/pipeline:latest
  pull_policy: never
  environment: &pipeline-env
    ES_HOST: http://elasticsearch:9200
    SITE_TZ: ${SITE_TZ:-UTC}
  networks:
    - netflow-net

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    container_name: flowwatch-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - netflow-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.6
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SECURITY_SHOWINSECURECLUSTERWARNING=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - netflow-net

  # Kibana data view + "FlowWatch traffic explorer" dashboard
  kibana-setup:
    <<: *pipeline
    container_name: kibana-setup
    command: ["python", "-m", "flowwatch.setup_kibana"]
    environment:
      KIBANA_HOST: http://kibana:5601
    restart: "no"
    depends_on:
      - kibana

  # TSDS index template + data stream, inventory, and history backfill
  es-setup:
    <<: *pipeline
    build: ./pipeline
    pull_policy: missing
    container_name: es-setup
    command: ["python", "-m", "flowwatch.setup_es"]
    environment:
      <<: *pipeline-env
      BACKFILL_DAYS: ${BACKFILL_DAYS:-14}
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # NetFlow v9 / IPFIX collector (1-minute rollups in TSDS)
  flow-collector:
    <<: *pipeline
    container_name: flow-collector
    command: ["python", "-m", "flowwatch.collector"]
    restart: unless-stopped
    ports:
      - "2055:2055/udp"
    depends_on:
      es-setup:
        condition: service_completed_successfully

  # Simulated exporters
  # (edge-rtr-01 = NetFlow v9, dc-core-01 = IPFIX) + scenario control API
  flow-generator:
    <<: *pipeline
    container_name: flow-generator
    command: ["python", "-m", "flowwatch.generator"]
    restart: unless-stopped
    environment:
      <<: *pipeline-env
      FLOW_TARGETS: ${FLOW_TARGETS:-flow-collector:2055}
      EXPORT_INTERVAL: "5"
    ports:
      - "8000:8000"
    depends_on:
      - flow-collector

  flowwatch-app:
    build: ./app
    container_name: flowwatch-app
    ports:
      - "8501:8501"
    environment:
      ES_HOST: http://elasticsearch:9200
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      SITE_TZ: ${SITE_TZ:-UTC}
      GENERATOR_URL: http://flow-generator:8000
      KIBANA_PUBLIC_URL: ${KIBANA_PUBLIC_URL:-http://localhost:5601}
    depends_on:
      es-setup:
        condition: service_completed_successfully
    networks:
      - netflow-net

  # Optional: ElastiFlow as a second collector for its Kibana dashboards.
  #   FLOW_TARGETS=flow-collector:2055,elastiflow:2055 docker compose --profile elastiflow up -d
  elastiflow:
    image: elastiflow/flow-collector:7.26.3
    container_name: elastiflow
    profiles: ["elastiflow"]
    restart: unless-stopped
    environment:
      - EF_LICENSE_ACCEPTED=true
      - EF_OUTPUT_ELASTICSEARCH_ENABLE=true
      - EF_OUTPUT_ELASTICSEARCH_ADDRESSES=elasticsearch:9200
      - EF_OUTPUT_ELASTICSEARCH_TLS_ENABLE=false
      - EF_OUTPUT_ELASTICSEARCH_INDEX_TEMPLATE_ENABLE=true
      - EF_FLOW_SERVER_UDP_IP=0.0.0.0
      - EF_FLOW_SERVER_UDP_PORT=2055,4739,6343,9995
      - EF_LOGGER_ENCODING=json
      - EF_API_IP=0.0.0.0
      - EF_API_PORT=8080
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - netflow-net

  # Debugging: Watch export packets on wire (docker compose --profile debug up udp-probe).
  udp-probe:
    image: ubuntu:22.04
    container_name: udp-probe
    profiles: ["debug"]
    command: ["/bin/bash", "-lc", "apt-get update && apt-get install -y tcpdump && tcpdump -i any udp port 2055 -nn -v -U"]
    network_mode: "service:flow-collector"

volumes:
  es_data:

networks:
  netflow-net:
    driver: bridge
